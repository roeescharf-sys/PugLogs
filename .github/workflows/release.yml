# Builds the ready-to-run downloads for Windows and macOS.
# - Push a tag like v0.5.0 to build both and publish them on a GitHub release.
# - Or run it by hand (Actions > Build downloads > Run workflow) to just test the builds.
name: Build downloads

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            system: Windows
          - os: macos-latest
            system: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: companion
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build
        working-directory: companion
        run: python build.py

      - name: Smoke test (starts, installs the addon, serves the setup page)
        shell: bash
        working-directory: companion
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/wow/Interface/AddOns"
          exe=dist/PugLogs.app/Contents/MacOS/PugLogs
          [ -f dist/PugLogs/PugLogs.exe ] && exe=dist/PugLogs/PugLogs.exe
          # --no-window: server only (CI machines have no screen); the app logs to a file
          HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home" PUGLOGS_WOW_DIR="$RUNNER_TEMP/wow" \
            PUGLOGS_PORT=47699 "$exe" --no-window &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:47699/api/state > "$RUNNER_TEMP/state.json" && break
            sleep 2
          done
          cat "$RUNNER_TEMP/home/.config/puglogs/puglogs.log"
          grep -q '"setupNeeded": true' "$RUNNER_TEMP/state.json"
          # The window engine (WebView2 on Windows, WebKit on macOS) must load from the build.
          # (separate home folder: the first copy is still running and holds its log open)
          mkdir -p "$RUNNER_TEMP/home2"
          HOME="$RUNNER_TEMP/home2" USERPROFILE="$RUNNER_TEMP/home2" "$exe" --selftest
          cat "$RUNNER_TEMP/home2/.config/puglogs/puglogs.log"
          grep -q "window engine OK" "$RUNNER_TEMP/home2/.config/puglogs/puglogs.log"
          test -f "$RUNNER_TEMP/wow/Interface/AddOns/PugLogs/PugLogs.toc"
          echo "Smoke test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: PugLogs-${{ matrix.system }}
          path: companion/dist/PugLogs-${{ matrix.system }}.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: companion/dist/PugLogs-${{ matrix.system }}.zip
